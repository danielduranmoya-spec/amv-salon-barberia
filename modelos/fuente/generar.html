<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de personajes · AMV</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<style>
  :root { --bg: #efe2c6; --ink: #1c1611; --panel: #fff8ea; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 16px; }
  h1 { font-size: 18px; margin: 0 12px 0 0; }
  button { font: inherit; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--ink); background: var(--panel); cursor: pointer; }
  #info { font-size: 13px; opacity: 0.75; }
  canvas { display: block; width: 100%; height: calc(100vh - 64px); }
</style>
</head>
<body>
<header>
  <h1>Personajes AMV</h1>
  <button id="b-pel">Descargar peluquero.glb</button>
  <button id="b-cli">Descargar cliente.glb</button>
  <span id="info">Arrastra para girar. Edita personajes.js y recarga para ver los cambios.</span>
</header>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { peluquero, cliente } from './personajes.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color('#efe2c6');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
const key = new THREE.DirectionalLight('#fff4e4', 2.2); key.position.set(2, 4, 5); scene.add(key);
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 50); camera.position.set(0, 1.3, 5);
const controls = new OrbitControls(camera, canvas); controls.target.set(0, 0.95, 0); controls.update();
const P = peluquero(), C = cliente();
P.position.x = -0.5; C.position.x = 0.5; scene.add(P, C);
document.getElementById('info').textContent += ` Triángulos: peluquero ${P.userData.triangulos.toLocaleString('es')}, cliente ${C.userData.triangulos.toLocaleString('es')}.`;
async function download(obj, name) {
  const clone = obj.clone(); clone.position.set(0, 0, 0);
  const glb = await new GLTFExporter().parseAsync(clone, { binary: true });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('b-pel').onclick = () => download(P, 'peluquero.glb');
document.getElementById('b-cli').onclick = () => download(C, 'cliente.glb');
function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
